[project]
name = "houseledger"
version = "0.1.0"
description = "Household bill, budget, and payment management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=5.2,<7.0",
    "django-environ>=0.14.0",
    "django-ratelimit>=4.1.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-dateutil>=2.9.0.post0",
    "redis>=6.4.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py", "node_modules", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "S",   # bandit (security)
    "SIM", # simplify
    "C4",  # comprehensions
]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"apps/core/templatetags/ui.py" = ["E501"]  # SVG path data
"config/settings/test.py" = ["S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = ["e2e: browser tests driven by Playwright (run with -m e2e)"]
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true
