{% extends "layouts/auth.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold tracking-tight">Reset your password</h1>
<p class="mt-2 text-sm muted">Enter your email and we will send you a reset link.</p>
<form method="post" class="mt-8 space-y-5" novalidate>
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="btn-primary w-full">Send reset link</button>
</form>
<p class="mt-8 text-center text-sm"><a href="{% url 'accounts:login' %}" class="font-semibold text-emerald-700 hover:underline dark:text-emerald-400">Back to sign in</a></p>
{% endblock %}
