{% extends "layouts/auth.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold tracking-tight">Create your account</h1>
<p class="mt-2 text-sm muted">Start organizing your household in minutes.</p>
<form method="post" class="mt-8 space-y-5" novalidate>
  {% csrf_token %}
  {{ form }}
  <button type="submit" class="btn-primary w-full">Create account</button>
</form>
<p class="mt-8 text-center text-sm muted">Already have an account? <a href="{% url 'accounts:login' %}" class="font-semibold text-emerald-700 hover:underline dark:text-emerald-400">Sign in</a></p>
{% endblock %}
