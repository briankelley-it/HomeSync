{% if messages %}
<div class="mb-6 space-y-2" role="status">
  {% for message in messages %}
  <div class="flex items-start gap-3 rounded-xl border px-4 py-3 text-sm
    {% if message.tags == 'error' %}border-rose-200 bg-rose-50 text-rose-800 dark:border-rose-500/30 dark:bg-rose-500/10 dark:text-rose-300
    {% elif message.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-500/30 dark:bg-amber-500/10 dark:text-amber-300
    {% else %}border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-500/30 dark:bg-emerald-500/10 dark:text-emerald-300{% endif %}">
    <span class="flex-1">{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
