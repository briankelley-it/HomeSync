{% load ui %}
<li>
  <a href="{{ bill.get_absolute_url }}" class="flex items-center gap-4 px-5 py-3 transition hover:bg-gray-50 dark:hover:bg-gray-800/40">
    <span class="size-2.5 shrink-0 rounded-full" style="background-color: {{ bill.category.color }}" aria-hidden="true"></span>
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-medium text-gray-900 dark:text-white">{{ bill.name }}</p>
      <p class="truncate text-xs muted">{{ bill.category.name }}{% if bill.property %} · {{ bill.property.name }}{% endif %} · due {{ bill.due_date|date:"M j" }}</p>
    </div>
    <div class="text-right">
      <p class="tabular text-sm font-semibold">{{ bill.balance|money:household }}</p>
      {% status_badge bill.display_status %}
    </div>
  </a>
</li>
